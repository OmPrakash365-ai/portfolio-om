{% extends 'base.html' %}

{% block content %}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
.main{
    min-height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
    color:white;
}

/* CARD */
.card{
    width:100%;
    max-width:650px;
    padding:30px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);

    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    text-align:center;
}

/* TITLE */
.card h1{
    margin-bottom:15px;
}

/* DESCRIPTION */
.desc{
    margin-bottom:20px;
    color:#ccc;
    line-height:1.6;
}

/* TECH */
.tech{
    margin-bottom:25px;
    color:#ddd;
}

/* BUTTON GROUP */
.buttons{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

/* BUTTON */
.btn{
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

/* GITHUB BUTTON */
.btn.github{
    background: linear-gradient(90deg, #facc15, #f59e0b);
    color:black;
}

/* LIVE BUTTON */
.btn.live{
    background: linear-gradient(90deg, #22c55e, #4ade80);
    color:black;
}

/* HOVER */
.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 12px rgba(250,204,21,0.6);
}

/* BACK */
.back{
    display:inline-block;
    margin-top:25px;
    color:#facc15;
    text-decoration:none;
    font-weight:600;
}

/* RESPONSIVE */
@media(max-width:480px){
    .card{
        padding:20px;
    }
}

</style>

<div class="main">

    <div class="card">

        <!-- TITLE -->
        <h1>{{ project.title }}</h1>
        {% if project.image %}
            <img src="{{ project.image.url }}" style="width:100%; max-height:300px; object-fit:cover; border-radius:15px; margin:15px 0;">
        {% endif %}
        <!-- DESCRIPTION -->
        <p class="desc">{{ project.description }}</p>

        <!-- TECH STACK -->
        <p class="tech">
            <strong>Tech Stack:</strong> {{ project.tech_stack }}
        </p>

        <!-- BUTTONS -->
        <div class="buttons">

            {% if project.github_link %}
            <a href="{{ project.github_link }}" target="_blank" class="btn github">
                GitHub
            </a>
            {% endif %}

            {% if project.live_demo %}
            <a href="{{ project.live_demo }}" target="_blank" class="btn live">
                Live Demo
            </a>
            {% endif %}

        </div>

        <!-- BACK -->
        <a href="{% url 'project_list' %}" class="back">
            ← Back to Projects
        </a>

    </div>

</div>

{% endblock %}
