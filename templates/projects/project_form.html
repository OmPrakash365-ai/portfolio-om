{% extends 'base.html' %}

{% block content %}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
.main{
    min-height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
}

/* CARD */
.card{
    width:100%;
    max-width:500px;
    padding:30px;
    border-radius:20px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border:1px solid rgba(255,255,255,0.1);

    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    color:white;
}

/* TITLE */
.card h2{
    text-align:center;
    margin-bottom:25px;
}

/* FORM */
form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* INPUTS */
form input,
form textarea,
form select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    outline:none;
    background: rgba(255,255,255,0.05);
    color:white;
}

/* PLACEHOLDER */
form input::placeholder,
form textarea::placeholder{
    color:#aaa;
}

/* FOCUS */
form input:focus,
form textarea:focus{
    border:1px solid #facc15;
    box-shadow: 0 0 10px rgba(250,204,21,0.5);
}

/* BUTTON */
.btn{
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;

    background: linear-gradient(90deg, #facc15, #f59e0b);
    color:black;

    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(250,204,21,0.6);
}

/* LABEL */
label{
    font-size:14px;
    margin-bottom:5px;
}

/* ERROR */
.errorlist{
    color:#f87171;
    font-size:13px;
    list-style:none;
}

</style>

<div class="main">

    <div class="card">

        <h2> Add / Edit Project</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Save Project 💾
            </button>

        </form>

    </div>

</div>

{% endblock %}
