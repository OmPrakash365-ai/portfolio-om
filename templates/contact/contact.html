{% extends 'base.html' %}
{% block content %}

<style>

/* MAIN */
.main{
    min-height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color:white;
}

/* CARD */
.card{
    width:100%;
    max-width:500px;
    padding:40px;
    border-radius:25px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(25px);
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    transition:0.4s;
}

.card:hover{
    transform: translateY(-5px) scale(1.02);
}

/* TITLE */
.card h2{
    font-size:32px;
    font-weight:600;
    margin-bottom:20px;
}

/* INPUT BOX */
.input-box{
    margin-bottom:18px;
}

/* INPUT & TEXTAREA */
.input-box input,
.input-box textarea{
    width:100%;
    padding:14px 15px;
    border:none;
    border-radius:12px;
    background: rgba(255,255,255,0.1);
    color:white;
    font-size:16px;
    outline:none;
    transition:0.3s;
}

.input-box input::placeholder,
.input-box textarea::placeholder{
    color:#ccc;
}

/* INPUT FOCUS EFFECT */
.input-box input:focus,
.input-box textarea:focus{
    background: rgba(255,255,255,0.15);
    transform:scale(1.02);
}

/* BUTTON */
.btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background: linear-gradient(90deg, #facc15, #f59e0b);
    color:black;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

/* BUTTON HOVER */
.btn:hover{
    transform:scale(1.05);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* SUCCESS */
.success{
    color:lightgreen;
    margin-bottom:15px;
    font-size:16px;
}

/* SOCIAL */
.social{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:20px;
}

/* SOCIAL LINKS */
.social a{
    text-decoration:none;
    color:white;
    font-size:16px;
    padding:8px 12px;
    border-radius:8px;
    background: rgba(255,255,255,0.08);
    transition:0.3s;
}

/* HOVER EFFECT */
.social a:hover{
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    transform:scale(1.1);
}

</style>

</style>

<div class="main">

    <div class="card">

        <h2>Contact Me 📩</h2>

        {% if success %}
        <p class="success">Message sent successfully!</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <input type="text" name="name" placeholder="Your Name" required>
            </div>

            <div class="input-box">
                <input type="email" name="email" placeholder="Your Email" required>
            </div>

            <div class="input-box">
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            </div>

            <button class="btn">Send Message</button>

        </form>

        <!-- SOCIAL LINKS -->
        <div class="social">

            <a href="https://github.com/OmPrakash365-ai" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/om-prakash9838/" target="_blank">LinkedIn</a>
        </div>

    </div>

</div>

{% endblock %}
