{% extends 'base.html' %}
{% block content %}

<div class="main">
    <div class="card fade-in">
        <h2>Contact Me</h2>

        {% if success %}
        <p style="color: var(--primary-neon); margin-bottom:15px; font-size:16px;">Message sent successfully!</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom:18px;">
                <input type="text" name="name" placeholder="Your Name" required style="width:100%; padding:14px 15px; border: 2px solid var(--secondary-cyan); border-radius:12px; background: rgba(255,255,255,0.05); color:white; font-size:16px; outline:none; transition:0.3s; box-sizing: border-box;" onfocus="this.style.borderColor='var(--primary-neon)';" onblur="this.style.borderColor='var(--secondary-cyan)';">
            </div>

            <div style="margin-bottom:18px;">
                <input type="email" name="email" placeholder="Your Email" required style="width:100%; padding:14px 15px; border: 2px solid var(--secondary-cyan); border-radius:12px; background: rgba(255,255,255,0.05); color:white; font-size:16px; outline:none; transition:0.3s; box-sizing: border-box;" onfocus="this.style.borderColor='var(--primary-neon)';" onblur="this.style.borderColor='var(--secondary-cyan)';">
            </div>

            <div style="margin-bottom:18px;">
                <textarea name="message" rows="5" placeholder="Your Message" required style="width:100%; padding:14px 15px; border: 2px solid var(--secondary-cyan); border-radius:12px; background: rgba(255,255,255,0.05); color:white; font-size:16px; outline:none; transition:0.3s; font-family: inherit; box-sizing: border-box;" onfocus="this.style.borderColor='var(--primary-neon)';" onblur="this.style.borderColor='var(--secondary-cyan)';"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Send Message</button>

        </form>

        <!-- SOCIAL LINKS -->
        <div style="margin-top:25px; display:flex; justify-content:center; gap:20px; flex-wrap: wrap;">
            <a href="https://github.com/OmPrakash365-ai" target="_blank" style="text-decoration:none; color:white; font-size:16px; padding:8px 12px; border-radius:8px; background: rgba(0, 212, 255, 0.1); border: 1px solid var(--secondary-cyan); transition:0.3s;" onmouseover="this.style.background='var(--secondary-cyan)'; this.style.color='black';" onmouseout="this.style.background='rgba(0, 212, 255, 0.1)'; this.style.color='white';">GitHub</a>
            <a href="https://www.linkedin.com/in/om-prakash9838/" target="_blank" style="text-decoration:none; color:white; font-size:16px; padding:8px 12px; border-radius:8px; background: rgba(0, 255, 136, 0.1); border: 1px solid var(--primary-neon); transition:0.3s;" onmouseover="this.style.background='var(--primary-neon)'; this.style.color='black';" onmouseout="this.style.background='rgba(0, 255, 136, 0.1)'; this.style.color='white';">LinkedIn</a>
        </div>

    </div>

</div>

{% endblock %}
