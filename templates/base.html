{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #2b2b2b;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px; /* FIXED HEIGHT */
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        /* Logo */
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: white;
        }

        /* Center Links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links li a {
            text-decoration: none;
            color: #ddd;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links li a:hover {
            color: #f9b233;
        }

        /* Right Buttons */
        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

       .btn {
    padding: 10px 22px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;
    display: inline-block;
}

/* LOGIN BUTTON */
.btn.login {
    background: transparent;
    border: 1px solid #facc15;
    color: #facc15;
}

/* SIGNUP BUTTON */
.btn.signup {
    background: transparent;
    border: 1px solid #facc15;
    color: #facc15;
}

/* HOVER EFFECT */
.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 12px rgba(250,204,21,0.6);
}

        .welcome {
            color: white;
            font-size: 14px;
        }

        /* MAIN CONTENT (IMPORTANT FIX) */
        .main-content {
            margin-top: 80px;  /* instead of body padding */
            min-height: calc(100vh - 80px);
        }

    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">MyPortfolio</div>

    <ul class="nav-links">
        
        <li><a href="/">Home</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
        <li><a href="{% url 'project_list' %}">Projects</a></li>
        

        <!-- FIX CONTACT LINK -->
         <li><a href="{% url 'contact' %}">Contact</a></li>
         
    </ul>

    <div class="auth-buttons">
        {% if user.is_authenticated %}
            <span class="welcome">Hi, {{ user.first_name }}</span>
            
            <a href="{% url 'logout' %}" class="btn logout">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn login">Login</a>
            <a href="{% url 'signup' %}" class="btn signup">Sign Up</a>
        {% endif %}
    </div>
</nav>

<!-- FIXED CONTENT WRAPPER -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
