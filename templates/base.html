{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
    <link rel="stylesheet" href="{% static 'css/cybersecurity-theme.css' %}">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27, #16213e);
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            color: #e0e0e0;
        }

        /* CYBERSECURITY THEME: Dark with neon accents */

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }

        /* Logo with tech style */
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #00ff88;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .logo::before {
            content: ">> ";
            color: #ff006e;
        }

        /* Center Links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links li a {
            text-decoration: none;
            color: #c0c0c0;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
            position: relative;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #00ff88;
            transition: width 0.3s;
        }

        .nav-links li a:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .nav-links li a:hover::after {
            width: 100%;
        }

        /* Right Buttons */
        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            border: 2px solid;
        }

        .btn.login {
            background: transparent;
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn.signup {
            background: #00ff88;
            border-color: #00ff88;
            color: #0a0e27;
        }

        .btn.logout {
            background: transparent;
            border-color: #ff006e;
            color: #ff006e;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .btn.logout:hover {
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.4);
        }

        .welcome {
            color: #00ff88;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-top: 80px;
            min-height: calc(100vh - 80px);
        }

    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">SecurePort</div>

    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
        <li><a href="{% url 'project_list' %}">Projects</a></li>
        <li><a href="{% url 'education' %}">Education</a></li>
        <li><a href="{% url 'skills' %}">Skills</a></li>
        <li><a href="{% url 'achievements' %}">Achievements</a></li>
        <li><a href="{% url 'certificates' %}">Certificates</a></li>
        <li><a href="{% url 'internships' %}">Internship</a></li>
        <li><a href="{% url 'hackathons' %}">Hackathons</a></li>
        <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>

    <div class="auth-buttons">
        {% if user.is_authenticated %}
            <span class="welcome">{{ user.first_name }}</span>
            <a href="{% url 'logout' %}" class="btn logout">Logout</a>
        {% else %}
        {% endif %}
    </div>
</nav>

<!-- FIXED CONTENT WRAPPER -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
