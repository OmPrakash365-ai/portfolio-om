{% extends 'base.html' %}

{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap');

/* CYBERSECURITY PORTFOLIO THEME */
body, html {
    margin: 0;
    padding: 0;
}

.main{
    position: relative;
    background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
}

/* Particles background */
#particles-js {
    position: fixed;
    top: 80px;
    left: 0;
    width: 100%;
    height: calc(100vh - 80px);
    z-index: 1;
}

/* Hero takes full viewport height */
.hero{
    text-align:center;
    min-height:calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    animation: fadeInDown 0.8s ease;
    position: relative;
    z-index: 10;
}

.architecture {
    padding: 80px 20px 60px;
    position: relative;
    z-index: 10;
    background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
}

@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.hero h1{
    font-size:56px;
    font-weight:700;
    color: #00ff88;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    margin-bottom: 10px;
    animation: glow 3s ease-in-out infinite;
}

.hero span{
    background: linear-gradient(90deg, #00ff88, #ff006e, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
}

@keyframes glow {
    0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
    50% { text-shadow: 0 0 40px rgba(0, 255, 136, 0.8); }
}

/* TYPING EFFECT */
#dynamic-text{
    margin-top:15px;
    font-size:18px;
    color:#00d4ff;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
    min-height: 30px;
}

#dynamic-text::after {
    content: "|";
    animation: blink 0.7s infinite;
    color: #ff006e;
}

@keyframes blink {
    0%, 49%, 100%{ opacity:1; }
    50%, 99%{ opacity:0; }
}

/* CALL-TO-ACTION BUTTON */
.hero .btn{
    display:inline-block;
    margin-top:30px;
    padding:13px 30px;
    border-radius:5px;
    text-decoration:none;
    font-weight:600;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(90deg, #00ff88, #00d4ff);
    color:#0a0e27;
    border: 2px solid #00ff88;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    transition:0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.hero .btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.6), 0 5px 20px rgba(0, 255, 136, 0.3);
}

/* TERMINAL */
.terminal{
    margin-top: 40px;
    background: rgba(0, 255, 136, 0.05);
    border: 2px solid rgba(0, 255, 136, 0.3);
    padding: 20px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    color: #00ff88;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    font-size: 13px;
    line-height: 1.8;
    letter-spacing: 0.5px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.1) inset;
    animation: terminalGlow 3s ease-in-out infinite;
}

@keyframes terminalGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.1) inset; }
    50% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.2) inset; }
}

.terminal div {
    margin: 5px 0;
}

.terminal div::before {
    content: '> ';
    color: #ff006e;
    font-weight: 600;
}

/* ARCHITECTURE SECTION */
.architecture{
    text-align:center;
}

.architecture h2 {
    font-size: 32px;
    color: #00ff88;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 40px;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
}

.diagram{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top: 40px;
}

.box{
    padding:20px;
    border-radius:5px;
    background: rgba(0, 255, 136, 0.05);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(0, 255, 136, 0.2);
    min-width:140px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #00d4ff;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: 0.3s;
    position: relative;
}

.box::before {
    content: '⬥';
    color: #ff006e;
    position: absolute;
    top: 5px;
    left: 10px;
    font-size: 8px;
}

.box:hover{
    transform: translateY(-5px);
    border-color: #00ff88;
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
    background: rgba(0, 255, 136, 0.1);
}

.arrow{
    width:50px;
    height:2px;
    background: linear-gradient(90deg, transparent, #00ff88, transparent);
    position:relative;
    overflow:hidden;
}

.arrow span{
    position:absolute;
    width:20px;
    height:100%;
    background:#00ff88;
    animation: move 1.5s linear infinite;
}

@keyframes move{
    0%{ left:-20px; }
    100%{ left:100%; }
}

</style>

<!-- PARTICLES BACKGROUND -->
<div id="particles-js"></div>

<div class="main">

    <!-- HERO -->
    <div class="hero">
        <h1>Hello, I'm <span>Om Prakash</span></h1>

        <h2 id="dynamic-text"></h2>

        <p style="margin-top:10px; color:#00d4ff; font-family: 'JetBrains Mono', monospace; font-size: 15px;">
            Building scalable systems ⚡ | Securing digital world 🔐
        </p>

        <a href="{% url 'contact' %}" class="btn">
            Hire Me 🚀
        </a>

        <!-- TERMINAL -->
        <div class="terminal">
            <div>Initializing Portfolio...</div>
            <div>Loading Projects... ✔</div>
            <div>Ready 🚀</div>
        </div>
    </div>

    <!-- ARCHITECTURE -->
    <div class="architecture">

        <h2>⚙️ System Architecture</h2>

        <div class="diagram">

            <div class="box">🌐 Frontend</div>
            <div class="arrow"><span></span></div>

            <div class="box">🔗 API</div>
            <div class="arrow"><span></span></div>

            <div class="box">⚙️ Backend</div>
            <div class="arrow"><span></span></div>

            <div class="box">🗄️ Database</div>

        </div>

    </div>

</div>

<!-- TYPING -->
<script>
const roles = [
    "Full Stack Developer",
    "Cyber Security Enthusiast",
    "Django Developer",
    "Problem Solver",
    "Tech Innovator"
];

let i = 0, j = 0;
let currentText = "";
let isDeleting = false;

function typeEffect() {
    const el = document.getElementById("dynamic-text");

    if (!isDeleting && j <= roles[i].length) {
        currentText = roles[i].substring(0, j++);
    } else if (isDeleting && j >= 0) {
        currentText = roles[i].substring(0, j--);
    }

    el.innerHTML = currentText;

    if (j === roles[i].length) {
        isDeleting = true;
        setTimeout(typeEffect, 1500);
        return;
    }

    if (j === 0 && isDeleting) {
        isDeleting = false;
        i = (i + 1) % roles.length;
    }

    setTimeout(typeEffect, isDeleting ? 40 : 80);
}

typeEffect();
</script>

<!-- PARTICLES -->
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 80 },
    color: { value: "#00ff88" },
    shape: { type: "circle" },
    opacity: { value: 0.3 },
    size: { value: 2 },
    move: { 
      enable: true,
      speed: 1.5,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out"
    },
    line_linked: { 
      enable: true, 
      distance: 150,
      color: "#00ff88",
      opacity: 0.2,
      width: 1
    }
  }
});
</script>

{% endblock %}
