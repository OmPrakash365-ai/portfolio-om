{% extends 'base.html' %}

{% block content %}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
body{
    min-height:100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
    overflow-x:hidden;
}

/* CONTAINER */
.container{
    min-height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* CARD */
.card{
    width:100%;
    max-width:900px;
    padding:40px;
    border-radius:20px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);

    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    color:white;
    display:flex;
    gap:30px;
}

/* LEFT */
.left{
    flex:1;
}

/* RIGHT */
.right{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

/* TITLE */
h2{
    margin-bottom:20px;
}

/* ERROR */
.error{
    color:#f87171;
    margin-bottom:10px;
}

/* INPUT BOX */
.input-box{
    position:relative;
    margin-bottom:20px;
}

/* INPUT */
.input-box input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    outline:none;
    background: rgba(255,255,255,0.05);
    color:white;
    font-size:14px;
    transition:0.3s;
}

/* LABEL */
.input-box label{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#aaa;
    font-size:14px;
    pointer-events:none;
    transition:0.3s;
}

/* FOCUS EFFECT */
.input-box input:focus{
    border-color:#facc15;
    box-shadow:0 0 10px rgba(250,204,21,0.5);
}

/* FLOAT LABEL */
.input-box input:focus + label,
.input-box input:valid + label{
    top:-8px;
    font-size:12px;
    color:#facc15;
    background:#1e293b;
    padding:0 5px;
    border-radius:5px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:14px;
    border-radius:25px;
    border:none;
    background: linear-gradient(90deg, #facc15, #f59e0b);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow: 0 0 15px rgba(250,204,21,0.6);
}

/* TEXT */
.signup-text{
    font-size:14px;
    margin-bottom:10px;
}

.signup-text a{
    color:#facc15;
    font-weight:bold;
    text-decoration:none;
}

/* SOCIAL */
.social button{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.2);
    background:transparent;
    color:white;
    margin-top:8px;
    cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:768px){
    .card{
        flex-direction:column;
    }
}

</style>

<div class="container">

    <div class="card">

        <!-- LEFT -->
        <div class="left">

            <h2>Login</h2>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="input-box">
                    <input type="email" name="email" required>
                    <label>Email Address</label>
                </div>

                <div class="input-box">
                    <input type="password" name="password" required>
                    <label>Password</label>
                </div>

                <button class="btn">Login</button>

            </form>

        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="signup-text">
                Don’t have an account?
                <a href="{% url 'signup' %}">Sign up</a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
